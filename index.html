<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>砂轮与油石教学台</title>
<style>
:root{
  color-scheme:light;
  --bg:#e8edf6; --blob1:#8ec5ff; --blob2:#ffb3c7; --blob3:#b9f3d4; --blob4:#d7c2ff;
  --glass:rgba(255,255,255,.52); --glass-2:rgba(255,255,255,.72); --glass-3:rgba(255,255,255,.34);
  --stroke:rgba(255,255,255,.75); --edge:rgba(15,23,42,.10); --shadow:0 10px 40px rgba(30,45,90,.14);
  --ink:#0d1526; --muted:#566074; --faint:#8a93a6;
  --accent:#0a7cff; --accent-ink:#fff; --orange:#f08a00; --red:#e5342b; --green:#1f9d55; --purple:#9b4dde; --teal:#0aa2c0; --yellow:#d9a400;
  --ring:#b8c2d3; --ring-edge:#6b778c; --ring-hi:#e9eef6; --steel1:#f4f7fb; --steel2:#8e9aae;
  --grid:rgba(15,23,42,.08); --axis:rgba(15,23,42,.35);
  --bandL:rgba(10,124,255,.08); --bandM:rgba(155,77,222,.08); --bandH:rgba(240,138,0,.09);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0b0e15; --blob1:#1d4f91; --blob2:#6b2347; --blob3:#145a46; --blob4:#3b2a73;
    --glass:rgba(30,34,46,.52); --glass-2:rgba(38,43,58,.74); --glass-3:rgba(30,34,46,.32);
    --stroke:rgba(255,255,255,.12); --edge:rgba(255,255,255,.08); --shadow:0 10px 40px rgba(0,0,0,.45);
    --ink:#eef1f7; --muted:#a3acbd; --faint:#6f788b;
    --accent:#3d9bff; --orange:#ff9f0a; --red:#ff5a50; --green:#35c76f; --purple:#c07cff; --teal:#40c8e0; --yellow:#ffd60a;
    --ring:#56627a; --ring-edge:#a9b4c7; --ring-hi:#7d8aa3; --steel1:#c9d2e0; --steel2:#4b566b;
    --grid:rgba(255,255,255,.07); --axis:rgba(255,255,255,.35);
    --bandL:rgba(61,155,255,.10); --bandM:rgba(192,124,255,.10); --bandH:rgba(255,159,10,.10);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0b0e15; --blob1:#1d4f91; --blob2:#6b2347; --blob3:#145a46; --blob4:#3b2a73;
  --glass:rgba(30,34,46,.52); --glass-2:rgba(38,43,58,.74); --glass-3:rgba(30,34,46,.32);
  --stroke:rgba(255,255,255,.12); --edge:rgba(255,255,255,.08); --shadow:0 10px 40px rgba(0,0,0,.45);
  --ink:#eef1f7; --muted:#a3acbd; --faint:#6f788b;
  --accent:#3d9bff; --orange:#ff9f0a; --red:#ff5a50; --green:#35c76f; --purple:#c07cff; --teal:#40c8e0; --yellow:#ffd60a;
  --ring:#56627a; --ring-edge:#a9b4c7; --ring-hi:#7d8aa3; --steel1:#c9d2e0; --steel2:#4b566b;
  --grid:rgba(255,255,255,.07); --axis:rgba(255,255,255,.35);
  --bandL:rgba(61,155,255,.10); --bandM:rgba(192,124,255,.10); --bandH:rgba(255,159,10,.10);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.5 -apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
/* 彩色模糊背景（流体玻璃的底色） */
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(38% 42% at 12% 18%,var(--blob1),transparent 70%),
    radial-gradient(34% 40% at 88% 12%,var(--blob2),transparent 70%),
    radial-gradient(40% 44% at 78% 88%,var(--blob3),transparent 70%),
    radial-gradient(36% 40% at 22% 86%,var(--blob4),transparent 70%);
  filter:blur(30px) saturate(130%);opacity:.9}
.glass{background:var(--glass);border:1px solid var(--stroke);border-radius:22px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.35);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* 顶栏 */
header{position:sticky;top:0;z-index:30;margin:10px 12px 0;padding:8px 10px 8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-radius:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{width:30px;height:30px;flex:none}
h1{font-size:15px;margin:0;white-space:nowrap;letter-spacing:.2px}
.brand .sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--glass-3);border:1px solid var(--edge)}
.nav button{position:relative;z-index:1;border:0;background:transparent;padding:6px 18px;border-radius:999px;color:var(--muted);font-weight:600;transition:color .25s}
.nav button[aria-selected="true"]{color:var(--ink)}
.nav .thumb{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--glass-2);box-shadow:0 2px 10px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.5);transition:left .35s cubic-bezier(.3,1.3,.5,1),width .35s cubic-bezier(.3,1.3,.5,1)}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--glass-3);border:1px solid var(--edge);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:3px 11px;border-radius:999px;color:var(--muted);font-size:12px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px rgba(10,124,255,.35)}
.btn{border:1px solid var(--edge);background:var(--glass-2);padding:6px 14px;border-radius:999px;font-weight:600;font-size:12px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(10,124,255,.35)}
.btn[disabled]{opacity:.45;cursor:default;transform:none}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--edge);background:var(--glass-3);padding:3px 10px;border-radius:999px;font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:rgba(229,52,43,.14);color:var(--red);border-color:rgba(229,52,43,.35)}

main{padding:12px}
.page[hidden]{display:none!important}
.shot *{transition:none!important}
.card{padding:14px 16px;min-width:0}
.card h2{font-size:14px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:500;color:var(--muted)}
.hint{color:var(--muted);font-size:12px}
.note{color:var(--faint);font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv b{font-variant-numeric:tabular-nums}
.mono{font-family:"SF Mono",Consolas,monospace;font-variant-numeric:tabular-nums}
canvas{display:block;width:100%}


/* ── 本站专用 ── */
:root{ --wheel:#c9b79a; --wheel-edge:#8a7556; --stone:#9aa9a0; --stone-edge:#5f7066; --hot:#e5342b; --cool:#2f8ff0; --oil:#d9a400; --bond:#e9e1cf; --pore:#2a3142; }
:root[data-theme="dark"]{ --wheel:#7d6d55; --wheel-edge:#c9b79a; --stone:#5d6e64; --stone-edge:#a9c2b3; --bond:#8a8370; --pore:#0d1018; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wheel:#7d6d55; --wheel-edge:#c9b79a; --stone:#5d6e64; --stone-edge:#a9c2b3; --bond:#8a8370; --pore:#0d1018; } }
.page{display:grid;gap:12px}
.page[hidden]{display:none!important}
.g2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:12px;align-items:start}
.g2e{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.dev{font-size:11.5px;font-weight:600;color:var(--accent);padding:2px 10px;border-radius:999px;background:var(--glass-2);border:1px solid var(--edge);white-space:nowrap}
.ttlrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap;margin:8px 0}
.flow .st{flex:1 1 120px;min-width:110px;border:1px solid var(--edge);background:var(--glass-3);border-radius:14px;padding:8px 10px;cursor:pointer;transition:all .2s;text-align:left;color:var(--ink)}
.flow .st .n{font-size:11px;color:var(--muted)} .flow .st b{display:block;font-size:13px}
.flow .st[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(10,124,255,.35)}
.flow .st[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}
.flow .ar{align-self:center;color:var(--faint);font-size:14px}
.flow .st.sf b::after{content:" ✦";color:var(--oil)}
svg.sch{width:100%;height:auto;display:block}
.sch text{font-family:inherit}
.kvt{display:grid;grid-template-columns:86px 1fr;gap:6px 10px;font-size:12.5px;line-height:1.6}
.kvt>span{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.ctq{font-size:11.5px;padding:2px 9px;border-radius:999px;background:rgba(229,52,43,.10);color:var(--red);border:1px solid rgba(229,52,43,.25)}
.explain{padding:10px 12px;border-radius:14px;background:var(--glass-3);border:1px solid var(--edge);font-size:12.5px;line-height:1.65}
.explain b.r{color:var(--red)}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--edge);padding:6px 6px;text-align:left;vertical-align:top}
.tbl th{color:var(--muted);font-weight:600;font-size:11px}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--edge);color:var(--muted);vertical-align:1px;white-space:nowrap}
.badge.ok{color:var(--green);border-color:rgba(31,157,85,.4)} .badge.gen{color:var(--orange);border-color:rgba(240,138,0,.4)} .badge.demo{color:var(--purple);border-color:rgba(155,77,222,.4)}
.ctl .grp{margin-bottom:9px} .ctl .lab{font-size:11.5px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;gap:8px}
.ctl .lab b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.spec{font:700 26px/1.2 "SF Mono",Consolas,monospace;letter-spacing:1px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.spec span{display:flex;flex-direction:column;align-items:center;gap:2px}
.spec span i{font:500 10.5px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--muted);font-style:normal;letter-spacing:0}
.spec span em{font-style:normal;padding:2px 8px;border-radius:10px;background:var(--glass-2);border:1px solid var(--edge)}
.myth{padding:10px 12px;border-radius:14px;background:var(--glass-3);border:1px solid var(--edge);font-size:12.5px}
.myth .x{color:var(--red);font-weight:700} .myth .o{color:var(--green);font-weight:700}
.bars{display:grid;grid-template-columns:120px 1fr 70px;gap:5px 8px;align-items:center;font-size:12px}
.bars .bt{height:10px;border-radius:5px;background:var(--grid);position:relative;overflow:hidden}
.bars .bt i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;transition:width .3s,background .3s}
.bars .bt s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45;left:50%}
.bars .tr{font-size:11.5px;font-weight:700;text-align:right}
.up{color:var(--red)} .dn{color:var(--green)} .eq{color:var(--muted)}
canvas{display:block;width:100%}
.note{color:var(--faint);font-size:11px}
.lv{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.spark{animation:spk .35s steps(2) infinite}
@keyframes spk{0%{opacity:1}50%{opacity:.15}}
.dash{stroke-dasharray:6 6;animation:dsh .5s linear infinite}
@keyframes dsh{to{stroke-dashoffset:-12}}
.dashs{stroke-dasharray:3 9;animation:dsh2 1.6s linear infinite}
@keyframes dsh2{to{stroke-dashoffset:-24}}
.v3wrap{position:relative;margin-top:4px}
.v3host{position:relative;height:clamp(380px,58vh,620px);border-radius:16px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.55),rgba(160,175,200,.25));border:1px solid var(--edge)}
:root[data-theme="dark"] .v3host{background:radial-gradient(ellipse at 50% 30%,rgba(70,80,100,.6),rgba(10,12,18,.6))}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .v3host{background:radial-gradient(ellipse at 50% 30%,rgba(70,80,100,.6),rgba(10,12,18,.6))} }
.v3host canvas{display:block}
.v3bar{position:absolute;right:10px;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:none}.v3bar>*{pointer-events:auto} .v3bar .seg{background:var(--glass-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)} .v3bar .seg button{color:var(--ink)} .v3bar .seg button[aria-pressed="true"]{color:var(--accent-ink)}
.v3tip{position:absolute;left:12px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.v3fs{position:absolute;right:10px;bottom:10px;background:var(--glass-2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
/* 全屏：浏览器原生全屏，或者不支持时用铺满窗口的替代样式 */
.v3wrap:fullscreen,.v3wrap.fs{margin:0;background:#e6ecf4}
.v3wrap.fs{position:fixed;inset:0;z-index:1000}
.v3wrap:fullscreen .v3host,.v3wrap.fs .v3host{height:100vh;height:100dvh;border-radius:0;border:0}
:root[data-theme="dark"] .v3wrap:fullscreen,:root[data-theme="dark"] .v3wrap.fs{background:#10131a}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .v3wrap:fullscreen,:root:not([data-theme="light"]) .v3wrap.fs{background:#10131a} }
.v3lab{position:absolute;inset:0;pointer-events:none}
.v3lab span{position:absolute;transform:translate(-50%,-130%);white-space:nowrap;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.82);color:#1b2333;border:1px solid rgba(0,0,0,.12);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.v3lab span.r{color:#c0281f} .v3lab span.b{color:#1f6fd0} .v3lab span.o{color:#9a6c00} .v3lab span.w{color:#1b2333;background:rgba(220,235,255,.9)}
footer{padding:4px 18px 16px;color:var(--faint);font-size:11px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
@media (max-width:1100px){ .g2,.g2e,.g3{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){
  header{margin:8px 8px 0;padding:8px 10px} main{padding:8px}
  .brand .sub{display:none} .brand{flex-basis:100%} h1{white-space:normal;font-size:14px}
  .nav button{padding:6px 9px} html,body{overflow-x:hidden}
  .kvt{grid-template-columns:70px 1fr}
}
</style>
</head>
<body>
<header class="glass">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb340"/><stop offset="1" stop-color="#e5342b"/></linearGradient></defs>
      <circle cx="20" cy="20" r="18" fill="url(#lg)"/><circle cx="20" cy="20" r="5" fill="#fff"/>
      <g fill="#fff" opacity=".85"><circle cx="11" cy="13" r="2"/><circle cx="28" cy="11" r="1.6"/><circle cx="30" cy="25" r="2.2"/><circle cx="14" cy="29" r="1.8"/><circle cx="21" cy="33" r="1.3"/><circle cx="8" cy="22" r="1.4"/></g>
    </svg>
    <div style="min-width:0">
      <div class="ttlrow"><h1 id="hTitle"></h1><span class="dev" id="hDev"></span></div>
      <div class="sub" id="hSub"></div>
    </div>
  </div>
  <nav class="nav" id="nav" role="tablist">
    <span class="thumb" id="navThumb"></span>
    <button role="tab" data-page="process" aria-selected="true"></button>
    <button role="tab" data-page="structure" aria-selected="false"></button>
    <button role="tab" data-page="micro" aria-selected="false"></button>
    <button role="tab" data-page="dress" aria-selected="false"></button>
    <button role="tab" data-page="coolant" aria-selected="false"></button>
    <button role="tab" data-page="params" aria-selected="false"></button>
  </nav>
  <div class="seg" id="langSeg"><button data-v="zh" aria-pressed="true">中文</button><button data-v="en" aria-pressed="false">EN</button></div>
  <div class="seg" id="themeSeg"><button data-v="auto"></button><button data-v="light"></button><button data-v="dark"></button></div>
</header>
<main>
  <section class="page" id="pg-process"></section>
  <section class="page" id="pg-structure" hidden></section>
  <section class="page" id="pg-micro" hidden></section>
  <section class="page" id="pg-dress" hidden></section>
  <section class="page" id="pg-coolant" hidden></section>
  <section class="page" id="pg-params" hidden></section>
</main>
<footer><span id="fNote"></span></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const cssv = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const fmt = (v, d = 1) => (isFinite(v) ? v.toFixed(d) : '—');
let lang = store.get('gl-lang') === 'en' ? 'en' : 'zh';
const L = (zh, en) => (lang === 'en' ? en : zh);
const OK = () => `<span class="badge ok">${L('已核实', 'verified')}</span>`;
const GEN = () => `<span class="badge gen">${L('通识', 'general')}</span>`;
const DEMO = () => `<span class="badge demo">${L('示意', 'illustrative')}</span>`;

const PAGES = {};          // name → { render(), enter(), leave(), redraw() }
let page = 'process';

function seg(id, items, cur, onPick) {   // 生成分段按钮
  return `<div class="seg" id="${id}">${items.map(([v, t]) => `<button data-v="${v}" aria-pressed="${String(v) === String(cur)}">${t}</button>`).join('')}</div>`;
}
function bindSeg(id, onPick) {
  const el = $(id); if (!el) return;
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    onPick(b.dataset.v);
  });
}
function prepCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(10, Math.round(r.width)), h = Math.max(10, Math.round(r.height));
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  return { g, w, h };
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const fluidPts = new THREE.Points(fluidGeo, new THREE.PointsMaterial({ size: key === 'od' || key === 'face' ? 10 : 2.6, vertexColors: true, transparent: true, opacity: 0.85, depthWrite: false }));
  if (key !== 'sf') machine.add(sparks); machine.add(fluidPts);
  const nozMat = new THREE.MeshStandardMaterial({ color: 0x8fa0b8, metalness: 0.6, roughness: 0.4 });
  nozzles.forEach(n => { const nz = new THREE.Mesh(new THREE.CylinderGeometry(n.kind === 'clean' ? 1.8 : 2.6, n.kind === 'clean' ? 2.6 : 3.4, 12, 16), nozMat); nz.position.copy(n.p); nz.lookAt(n.to); nz.rotateX(Math.PI / 2); machine.add(nz);
    if (n.label) addLabel(n.p.clone(), n.label, n.kind === 'oil' ? 'o' : 'b'); });

  // ── 相机（拖动旋转、滚轮缩放）──
  const big = key === 'groove' && ringType === 'inner', og = key === 'groove' && ringType === 'outer';
  const sfv = key === 'sf', ft = key === 'face' && FACE_MODE === 'thru';
  const view = { th: big || og ? -0.5 : key === 'od' ? 0.45 : ft ? 1.2 : key === 'face' ? 0.28 : sfv ? (ringType === 'inner' ? -0.95 : -1.3) : -0.85, ph: sfv && ringType === 'outer' ? 0.62 : big || og ? 0.42 : key === 'od' ? 0.22 : ft ? 0.22 : key === 'face' ? 0.3 : 0.38, d: sfv ? (ringType === 'inner' ? 300 : 300) : big ? 250 : og ? 220 : key === 'od' ? 1150 : ft ? 1050 : key === 'face' ? 820 : 250, tgt: new THREE.Vector3(big ? 42 : og ? 22 : key === 'od' ? -80 : 0, sfv ? (ringType === 'inner' ? 18 : -24) : big ? 0 : key === 'od' ? 0 : ft ? -90 : key === 'face' ? -70 : 12, 0) };

  // 只看套圈：隐藏刀具、夹具、液流和标签，镜头拉近到工件
  S.setSolo = on => { S.solo = on; machine.children.forEach(o => { if (o !== work) o.visible = !on && (V3SUP || !supObjs.has(o)); }); work.visible = on || key !== 'face'; lab.style.display = on || !V3LBL ? 'none' : '';
    if (on) { S.saved = { th: view.th, ph: view.ph, d: view.d, tgt: view.tgt.clone() }; view.th = 0.6; view.ph = 0.45; view.d = ringType === 'inner' ? 170 : 230; view.tgt.set(0, 0, 0); }
    else if (S.saved) { Object.assign(view, { th: S.saved.th, ph: S.saved.ph, d: S.saved.d }); view.tgt.copy(S.saved.tgt); }

  S.setSup(V3SUP);
  S.setXray = on => { xrayMats.forEach(m => { m.transparent = on; m.opacity = on ? m.userData.op : 1; m.depthWrite = !on; m.needsUpdate = true; }); };

        for (let k = 0; k < (emitters ? 10 : 6) && src.length; k++) { const i = Math.floor(Math.random() * NS); if (sl[i] > 0) continue; sl[i] = 0.35 + Math.random() * 0.4;

        for (let i = 0; i < NS; i++) { if (sl[i] <= 0) continue; sl[i] -= dt; sv[i].addScaledVector(localDown, 260 * dt);
          sp[i * 3] += sv[i].x * dt; sp[i * 3 + 1] += sv[i].y * dt; sp[i * 3 + 2] += sv[i].z * dt; if (sl[i] <= 0) sp[i * 3 + 1] = 9999; }

        for (let j = 0; j < PER; j++) { const i = k * PER + j; fl[i] = (fl[i] + dt * (n.kind === 'clean' ? 2.4 : 1.5)) % 1.18; const u = fl[i]; wv.copy(n.p).lerp(n.to, u);

}

    '<div style="margin-top:8px"><b>为什么这样定位</b>：套圈靠自己已经磨好的面定位，不用夹紧，薄壁套圈不会被夹变形；上一道磨好的面就是下一道的基准（以外定沟、以沟定孔）。</div>' +
    '<div style="margin-top:8px"><b>要注意</b>：支撑头的位置和角度按工艺调，调不好容易磨出多棱、圆度变差；支撑头会磨损，要定期检查、更换；靠山和支撑头上要干净，夹着磨屑会把套圈顶偏，还会划伤外圆。</div>',
    'All grinding after heat treatment (inner raceway, bore, outer raceway, superfinishing) locates the ring on this support set:' + ul([
      '<b>Backing plate (靠山)</b>: face support. The ring face sits on it, held magnetically, fixing the axial position — which is why the faces are ground flat and parallel first.',
      '<b style="color:var(--red)">Support shoes (支撑头)</b>: bear on the OD or raceway and fix the radial position (the two red blocks).',
      '<b>Shoe plate (支撑板)</b>: carries the shoes and sets their position and angle.'].concat(key === 'sf' ? ['<b style="color:#2f7d5b">Pressure rollers (压轮)</b>: two bearings (6203 here) press the left and right of the front face, mounted on the two legs of a fork pushed in axially from the front, holding the ring against the backing plate; they roll as the ring turns.'] : [])) +
    `<div style="margin-top:8px">${here}</div>` +
    '<div style="margin-top:8px"><b>Why locate this way</b>: the ring locates on its own finished surfaces without clamping, so the thin ring is not squeezed out of shape; each finished surface is the datum for the next step (raceway from OD, bore from raceway).</div>' +
    '<div style="margin-top:8px"><b>Watch out</b>: set shoe position and angle per the process — a poor setting gives lobing and poor roundness; shoes wear and must be checked and replaced; keep the backing plate and shoes clean — trapped swarf pushes the ring off-centre and scratches the OD.</div>')}</div></div>`;
}

// 无心磨为什么至少磨两遍：圆度误差逐遍变小（示意）
function twoPassCard() {
  const stages = [[L('热处理后', 'after heat treatment'), 7, 5], [L('粗磨后', 'after rough pass'), 2.4, 1.8], [L('精磨后', 'after finish pass'), 0.6, 0.45]];
  const poly = (cx, cy, a2, a3) => { const pts = []; for (let i = 0; i <= 120; i++) { const t = i / 120 * Math.PI * 2, r = 34 + a2 * Math.cos(2 * t + 0.6) + a3 * Math.cos(3 * t); pts.push(`${(cx + r * Math.cos(t)).toFixed(1)},${(cy + r * Math.sin(t)).toFixed(1)}`); } return pts.join(' '); };
  const svg = `<svg viewBox="0 0 420 120" style="width:100%;max-height:170px" role="img" aria-label="roundness">
    ${stages.map(([t, a2, a3], i) => { const cx = 70 + i * 140; return `<circle cx="${cx}" cy="52" r="34" fill="none" stroke="var(--faint)" stroke-dasharray="3 3"/>
      <polygon points="${poly(cx, 52, a2, a3)}" fill="rgba(10,124,255,.10)" stroke="var(--accent)" stroke-width="2"/>
      <text x="${cx}" y="110" font-size="12" text-anchor="middle" fill="var(--ink)">${t}</text>${i < 2 ? `<text x="${cx + 70}" y="56" font-size="16" text-anchor="middle" fill="var(--muted)">→</text>` : ''}`; }).join('')}
  </svg>`;
  const ul = a => `<ul style="margin:6px 0 0;padding-left:18px;line-height:1.7">${a.map(t => `<li>${t}</li>`).join('')}</ul>`;
  return `<div class="glass card"><h2>${L('为什么无心磨至少要磨两遍（粗磨 + 精磨）', 'Why centerless grinding takes at least two passes (rough + finish)')} ${GEN()}</h2>
    ${svg}<div class="note" style="text-align:center;margin:-2px 0 6px">${L('圆度误差逐遍变小（放大示意，虚线是理想圆）', 'roundness error shrinks pass by pass (exaggerated; dashed = true circle)')}</div>
    <div class="explain">${L(
      ul([
        '<b>毛坯不圆、留量不均</b>：热处理后外圆有椭圆、多棱等变形，同一圈上这边留量多、那边少。',
        '<b>一遍磨不圆</b>：无心磨没有固定的回转中心，靠外圆自己定位。原来的形状误差会有一部分「复映」到磨后的工件上，每磨一遍只能按比例变小，所以要分几遍才能把圆度降下来。',
        '<b>粗磨</b>：进给大，去掉大部分留量，先把变形和误差降下来。但切削力大、发热多，工件和机床的弹性变形也大，尺寸和圆度不够准，表面也粗。',
        '<b>精磨</b>：留量小、切削力小、发热少，修掉粗磨留下的圆度误差和多棱，把尺寸做准、粗糙度降下来，也不容易烧伤。',
        '<b>如果一遍磨完</b>：要一次去掉全部留量，切削力和热量都很大 → 烧伤、振纹、多棱，尺寸散差也大。',
        '<b>精磨后的外圆就是下一道磨大沟的支撑面</b>（支撑头顶在外圆上）：外圆不圆，沟道也磨不圆。']) +
      '<div class="note" style="margin-top:6px">粗磨、精磨一般用不同的砂轮粒度和进给量；变形大或精度要求高的，中间还会再加一遍。具体遍数和留量分配按本厂工艺。</div>',
      ul([
        '<b>Out-of-round blank, uneven stock</b>: after heat treatment the OD is oval or lobed, with more stock on one side than the other.',
        '<b>One pass cannot make it round</b>: centerless grinding has no fixed axis — the ring locates on its own OD. Part of the incoming form error is copied into the ground part; each pass only reduces it by a ratio, so several passes are needed to bring roundness down.',
        '<b>Rough pass</b>: high feed removes most of the stock and brings distortion and error down, but the high force and heat deflect the part and machine, so size and roundness are not yet accurate and the surface is rough.',
        '<b>Finish pass</b>: small stock, low force, little heat — removes the remaining roundness error and lobing, brings size on target and roughness down, with low burn risk.',
        '<b>All in one pass</b>: removing all the stock at once means high force and heat → burn, chatter, lobing and wide size scatter.',
        '<b>The finished OD is the support surface for outer-raceway grinding</b> (the shoes sit on it): an out-of-round OD gives an out-of-round raceway.']) +
      '<div class="note" style="margin-top:6px">Rough and finish passes usually use different wheel grits and feeds; with large distortion or tight tolerances an extra intermediate pass is added. The number of passes and stock split follow your process.</div>')}</div></div>`;
}

  if (w.classList.contains('fs')) { fakeFs(w, false); return; }

// ── 微观结构图：随机磨粒 + 结合剂桥 + 气孔 ──
function drawMicro() {
  const cv = $('microCv'); if (!cv) return;
  const { g, w, h } = prepCanvas(cv), r = rng(20261031 + ST.grit * 7 + ST.struct * 131);
  const A = ABR[ST.abr], d = 34;                       // 屏幕上磨粒直径固定，真实尺寸由比例尺说明
  const pitch = d * (1.08 + 0.075 * ST.struct);        // 组织号越大，磨粒间距越大、气孔越多
  const bw = d * (0.10 + 0.032 * ST.grade);            // 结合度越高（越「硬」），结合剂桥越粗
  g.fillStyle = cssv('--pore'); g.fillRect(0, 0, w, h);
  const pts = [];
  for (let y = d * 0.4; y < h + d; y += pitch * 0.87) for (let x = (Math.round(y / pitch) % 2) * pitch / 2; x < w + d; x += pitch)
    pts.push([x + (r() - .5) * pitch * .35, y + (r() - .5) * pitch * .35, d / 2 * (0.75 + r() * 0.45)]);
  // 结合剂桥
  g.strokeStyle = BONDS[ST.bond]; g.lineCap = 'round';
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[j], dd = Math.hypot(x2 - x1, y2 - y1);
    if (dd < pitch * 1.25) { g.lineWidth = bw * (0.7 + r() * 0.5); g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
  }
  // 磨粒（不规则多边形，外面裹一层结合剂）
  for (const [x, y, rr] of pts) {
    const n = 6 + Math.floor(r() * 3), a0 = r() * 6.28, poly = [];
    for (let k = 0; k < n; k++) { const a = a0 + k / n * 6.283, q = rr * (0.7 + r() * 0.45); poly.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); }
    const path = () => { g.beginPath(); poly.forEach(([px, py], k) => k ? g.lineTo(px, py) : g.moveTo(px, py)); g.closePath(); };
    g.lineWidth = bw * 0.55; g.strokeStyle = BONDS[ST.bond]; path(); g.stroke();
    g.fillStyle = A.c; path(); g.fill(); g.lineWidth = 1; g.strokeStyle = A.e; path(); g.stroke();
  }
  // 比例尺
  const D50 = GRITS[ST.grit][1], umPerPx = D50 / d, bar = 100 * umPerPx;
  const nice = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000].find(v => v >= bar) || 2000, bpx = nice / umPerPx;
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(10, h - 34, bpx + 70, 26);
  g.fillStyle = '#fff'; g.fillRect(18, h - 23, bpx, 4); g.font = '600 ' + FONT; g.textBaseline = 'middle'; g.fillText(nice + ' µm', 24 + bpx, h - 21);
  // 图例
  const lg = [[A.c, L('磨粒', 'grain')], [BONDS[ST.bond], L('结合剂', 'bond')], [cssv('--pore'), L('气孔', 'pore')]];
  g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(w - 200, 8, 192, 24);
  lg.forEach(([c, t], i) => { g.fillStyle = c; g.fillRect(w - 192 + i * 62, 14, 12, 12); g.strokeStyle = '#fff'; g.lineWidth = .6; g.strokeRect(w - 192 + i * 62, 14, 12, 12); g.fillStyle = '#fff'; g.fillText(t, w - 176 + i * 62, 20); });
}

// ═════════ 微观页：单颗磨粒切削、砂轮表面状态、超精、脏东西在哪 ═════════
const MC = { h: 1.6, bond: 'mid', raf: 0, t0: 0, life: null, sfT: 0, sfPlay: true, osc: 1, spd: 1 };

// ── A. 一颗磨粒怎样切削：滑擦 → 耕犁 → 切削 ──
// 切深从 0 线性增大到 hmax；hR、hC 为进入耕犁、切削的临界切深（相对单位）
const HR = 0.35, HC = 0.8;
function grainShares(hmax) {
  const seg = (a, b) => Math.max(0, Math.min(hmax, b) - Math.min(hmax, a)) / hmax;
  return { rub: seg(0, HR), plow: seg(HR, HC), cut: seg(HC, 99) };
}
function drawGrain(now) {
  const cv = $('grainCv'); if (!cv) return;
  const { g, w, h } = prepCanvas(cv), hmax = MC.h, sh = grainShares(hmax);
  const surf = h * 0.42, L0 = 40, L1 = w - 40, depthPx = 26;   // 1 相对单位 = 26 px
  const u = ((now / 2600) % 1), xg = L0 + (L1 - L0) * u, dep = hmax * u;
  // 工件
  g.fillStyle = cssv('--ring'); g.fillRect(0, surf, w, h - surf);
  g.strokeStyle = cssv('--ring-edge'); g.beginPath(); g.moveTo(0, surf); g.lineTo(w, surf); g.stroke();
  // 已经被切掉的部分（切削区才真正去除材料）
  g.fillStyle = cssv('--bg');
  g.beginPath(); g.moveTo(L0, surf);
  for (let x = L0; x <= xg; x += 2) { const d = hmax * (x - L0) / (L1 - L0); g.lineTo(x, surf + Math.max(0, d - HC * 0.6) * depthPx); }
  g.lineTo(xg, surf); g.closePath(); g.fill();
  // 阶段色带
  const zx = d => L0 + (L1 - L0) * Math.min(1, d / hmax);
  [[0, HR, '#2f8ff0', L('滑擦', 'rubbing')], [HR, HC, '#9b4dde', L('耕犁', 'ploughing')], [HC, 99, '#e5342b', L('切削', 'cutting')]].forEach(([a, b, c, t]) => {
    if (hmax <= a) return;
    const x1 = zx(a), x2 = zx(Math.min(b, hmax));
    g.fillStyle = c; g.globalAlpha = .85; g.fillRect(x1, h - 26, x2 - x1, 8); g.globalAlpha = 1;
    g.font = '600 ' + FONT; g.fillStyle = c; g.textAlign = 'center'; g.fillText(t, (x1 + x2) / 2, h - 32);
  });
  // 热（滑擦和耕犁越多越热）
  const heat = dep < HC ? 1 : 0.45;
  const grd = g.createRadialGradient(xg, surf + dep * depthPx * .6, 2, xg, surf + dep * depthPx * .6, 46);
  grd.addColorStop(0, `rgba(255,120,30,${0.55 * heat})`); grd.addColorStop(1, 'rgba(255,120,30,0)');
  g.fillStyle = grd; g.fillRect(xg - 50, surf - 50, 100, 120);
  // 耕犁：材料被挤到两侧，侧视图上画成前方隆起
  if (dep > HR && dep < HC) { g.fillStyle = cssv('--ring'); g.beginPath(); g.ellipse(xg + 18, surf, 14, 6 * (dep - HR) / (HC - HR) + 2, 0, Math.PI, 0); g.fill(); g.strokeStyle = '#9b4dde'; g.stroke(); }
  // 切屑：切削阶段在磨粒前方卷起
  if (dep > HC) {
    const L = Math.min(60, (dep - HC) * 50 + 8);
    g.strokeStyle = '#7a8aa3'; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath();
    g.moveTo(xg + 10, surf + 2); g.quadraticCurveTo(xg + 14 + L * .3, surf - L * .9, xg + 2 - L * .2, surf - L);
    g.stroke(); g.lineWidth = 1;
  }
  // 磨粒（负前角的多面体）
  const gy = surf + dep * depthPx * 0.6 - 30;
  g.save(); g.translate(xg, gy);
  g.fillStyle = '#f4f7fb'; g.strokeStyle = '#6b778c'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-22, -30); g.lineTo(18, -34); g.lineTo(26, 6); g.lineTo(6, 34); g.lineTo(-14, 28); g.lineTo(-26, 0); g.closePath(); g.fill(); g.stroke();
  g.restore();
  g.fillStyle = cssv('--muted'); g.textAlign = 'left'; g.font = FONT;
  g.fillText(L('磨粒运动方向 →　切深从 0 逐渐增大', 'grain moves → ; depth grows from zero'), 12, 16);
  const ph = dep < HR ? L('滑擦：只摩擦、发热，不去材料', 'rubbing: friction and heat, no removal') : dep < HC ? L('耕犁：材料被挤向两边，仍不成屑', 'ploughing: metal pushed aside, no chip yet') : L('切削：形成切屑，真正去除材料', 'cutting: a chip forms, material is removed');
  g.font = '600 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'; g.fillStyle = cssv('--ink'); g.fillText(ph, 12, 34);
  // 能量占比条
  const tot = sh.rub * 2.2 + sh.plow * 1.6 + sh.cut * 1.0;
  $('grainShare').innerHTML = `<div class="bars">
    <span>${L('滑擦', 'rubbing')}</span><div class="bt"><i style="width:${sh.rub * 100}%;background:#2f8ff0"></i></div><span class="tr">${fmt(sh.rub * 100, 0)}%</span>
    <span>${L('耕犁', 'ploughing')}</span><div class="bt"><i style="width:${sh.plow * 100}%;background:#9b4dde"></i></div><span class="tr">${fmt(sh.plow * 100, 0)}%</span>
    <span>${L('切削', 'cutting')}</span><div class="bt"><i style="width:${sh.cut * 100}%;background:#e5342b"></i></div><span class="tr">${fmt(sh.cut * 100, 0)}%</span>
    <span>${L('比磨削能（相对）', 'specific energy (rel.)')}</span><div class="bt"><i style="width:${Math.min(100, tot / 2.2 * 100)}%;background:var(--orange)"></i></div><span class="tr">×${fmt(tot / 1.15, 1)}</span></div>`;
}

// ── B. 砂轮表面的一生：锋利 → 钝化 / 堵塞 → 修整 ──
function newLife() {
  const r = rng(77), gr = [];
  for (let i = 0; i < 11; i++) gr.push({ x: 26 + i * 50 + r() * 10, p: 18 + r() * 14, sharp: 0.85 + r() * 0.15, flat: 0, load: 0, seed: r() });
  return { gr, t: 0, wear: 0, dressAt: -1, r: rng(5) };
}
const BOND = { soft: { out: 0.45, glaze: 0.6 }, mid: { out: 0.25, glaze: 1 }, hard: { out: 0.06, glaze: 1.5 } };
function stepLife(dt) {
  const S = MC.life, B = BOND[MC.bond];
  S.t += dt;
  for (const q of S.gr) {
    q.sharp = Math.max(0, q.sharp - dt * 0.09 * (0.6 + q.seed));
    q.flat = Math.min(16, q.flat + dt * 1.2 * B.glaze * (1 - q.sharp));
    q.load = Math.min(1, q.load + dt * 0.035 * B.glaze * (1.3 - q.sharp));
    // 钝到一定程度：结合剂软 → 磨粒破碎或脱落，露出新刃（自锐）
    if (q.sharp < 0.25 && S.r() < B.out * dt * 3) { q.sharp = 0.9; q.flat = 0; q.p = 16 + S.r() * 14; q.load *= 0.4; S.wear += 1; }
  }
}
function lifeStats() {
  const n = MC.life.gr.length, avg = k => MC.life.gr.reduce((a, q) => a + q[k], 0) / n;
  const sharp = avg('sharp'), load = avg('load'), flat = avg('flat') / 16;
  return { sharp, load, heat: Math.min(1, 0.25 + flat * 0.45 + load * 0.4 + (1 - sharp) * 0.2), wear: MC.life.wear };
}
function drawLife(dt) {
  const cv = $('lifeCv'); if (!cv) return;
  if (!MC.life) MC.life = newLife();
  if (dt) stepLife(dt);
  const { g, w, h } = prepCanvas(cv), S = MC.life, base = h * 0.68, sx = w / 580;
  g.fillStyle = cssv('--pore'); g.fillRect(0, 0, w, h);
  // 结合剂基体
  g.fillStyle = '#d4a35c'; g.fillRect(0, base, w, h - base);
  for (let i = 0; i < 40; i++) { g.fillStyle = cssv('--pore'); g.beginPath(); g.arc((i * 47 % 580) * sx, base + 18 + (i * 13 % 50), 5, 0, 7); g.fill(); }
  for (const q of S.gr) {
    const x = q.x * sx, top = base - q.p;
    // 堵塞：磨粒之间的气孔被切屑填满
    if (q.load > 0.05) { g.fillStyle = `rgba(110,118,135,${0.3 + q.load * 0.7})`; const lh = 18 * q.load; g.fillRect(x + 18, base - lh, 50 * sx - 34, lh + 4); }
    g.fillStyle = '#f4f7fb'; g.strokeStyle = '#6b778c';
    g.beginPath(); g.moveTo(x - 17, base + 8); g.lineTo(x - 14 + q.flat * .5, top + q.flat * .6); g.lineTo(x + 2, top - 9 * q.sharp); g.lineTo(x + 15 - q.flat * .5, top + q.flat * .6); g.lineTo(x + 18, base + 8); g.closePath(); g.fill(); g.stroke();
    if (q.flat > 2) { g.strokeStyle = '#fff'; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 14 + q.flat * .5, top + q.flat * .6); g.lineTo(x + 15 - q.flat * .5, top + q.flat * .6); g.stroke(); g.lineWidth = 1; }
  }
  // 工件
  g.fillStyle = cssv('--ring'); g.fillRect(0, 0, w, base - 46);
  g.fillStyle = cssv('--muted'); g.font = FONT; g.textAlign = 'left'; g.fillText(L('工件', 'workpiece'), 10, 16);
  // 修整器
  if (S.dressAt >= 0) {
    const dx = (S.t - S.dressAt) * 420 * sx;
    if (dx < w + 20) { g.fillStyle = '#9ad7ff'; g.beginPath(); g.moveTo(dx, base - 30); g.lineTo(dx + 10, base - 18); g.lineTo(dx - 10, base - 18); g.closePath(); g.fill(); g.fillStyle = cssv('--accent'); g.fillText(L('金刚石修整', 'diamond dressing'), dx + 12, base - 24);
      for (const q of S.gr) if (q.x * sx < dx && q.dressed !== S.dressAt) { q.sharp = 1; q.flat = 0; q.load = 0; q.p = 12 + q.seed * 6; q.dressed = S.dressAt; } }
    else S.dressAt = -1;
  }
  const st = lifeStats(), bar = (k, v, c) => `<span>${k}</span><div class="bt"><i style="width:${fmt(v * 100, 0)}%;background:${c}"></i></div><span class="tr">${fmt(v * 100, 0)}%</span>`;
  $('lifeStat').innerHTML = `<div class="bars">${bar(L('锋利度', 'sharpness'), st.sharp, 'var(--green)')}${bar(L('堵塞程度', 'loading'), st.load, '#6e7687')}${bar(L('磨削发热（趋势）', 'grinding heat (trend)'), st.heat, 'var(--red)')}
    <span>${L('自锐脱落颗数', 'grains released')}</span><div></div><span class="tr">${st.wear}</span></div>`;
}

// ── C. 超精：交叉网纹 + 粗糙度从切削期到抛光期 ──
function sfProfile() { const r = rng(9), a = []; for (let i = 0; i < 240; i++) a.push(Math.sin(i * 0.9) * 0.35 + (r() - 0.5) * 1.3 + (r() < 0.07 ? 1.4 : 0)); return a; }
const SF_PROF = sfProfile();
function sfState(t) {           // t：0..1 的超精时间；去除先快后慢（油石表面被切屑填满后转入抛光）
  const cut = 1 - Math.exp(-t * 4.2);
  const clip = 1.9 - 2.25 * cut;
  let ra = 0; const prof = SF_PROF.map(v => Math.min(v, clip)); const m = prof.reduce((a, b) => a + b, 0) / prof.length;
  prof.forEach(v => ra += Math.abs(v - m)); ra /= prof.length;
  const stage = t < 0.28 ? L('切削期：油石锋利，削掉磨削留下的尖峰', 'cutting phase: sharp stone cuts the grinding peaks')
    : t < 0.6 ? L('过渡期：油石表面开始被切屑填满，去除变慢', 'transition: stone surface fills with swarf, removal slows')
      : L('抛光期：油石与工件之间形成油膜，几乎不再去除，表面变亮', 'polishing phase: an oil film forms, removal almost stops, surface brightens');
  return { prof, clip, ra, stage, removal: cut };
}
function drawSF() {
  const cv = $('hatchCv'), cv2 = $('profCv'); if (!cv || !cv2) return;
  const k = 0.42 * MC.osc / MC.spd, ang = Math.atan(k) * 180 / Math.PI;
  { const { g, w, h } = prepCanvas(cv);
    g.fillStyle = cssv('--ring'); g.fillRect(0, 0, w, h);
    const A = h * 0.4, lam = (2 * Math.PI * A) / Math.max(0.05, k);   // 轨迹最大斜率 = k
    const revs = 2 + Math.floor(MC.sfT * 60);
    g.strokeStyle = 'rgba(40,50,70,.38)'; g.lineWidth = 1;
    for (let p = 0; p < revs; p++) {
      g.beginPath();
      for (let x = 0; x <= w; x += 4) { const X = p * w * 0.37 + x, y = h / 2 + A * Math.sin(2 * Math.PI * X / lam); x ? g.lineTo(x, y) : g.moveTo(x, y); }
      g.stroke();
    }
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(8, 8, 250, 22); g.fillStyle = '#fff'; g.font = FONT; g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillText(L(`沟道展开图 · 网纹交叉角 ≈ ${fmt(2 * ang, 0)}°`, `raceway unrolled · cross-hatch angle ≈ ${fmt(2 * ang, 0)}°`), 14, 19);
    g.textBaseline = 'alphabetic';
  }
  { const { g, w, h } = prepCanvas(cv2), S = sfState(MC.sfT), y0 = h * 0.55, sc = h * 0.16;
    g.fillStyle = cssv('--ring'); g.beginPath(); g.moveTo(0, h);
    SF_PROF.forEach((v, i) => g.lineTo(i / (SF_PROF.length - 1) * w, y0 - v * sc)); g.lineTo(w, h); g.closePath(); g.globalAlpha = .35; g.fill(); g.globalAlpha = 1;
    g.fillStyle = cssv('--ring'); g.beginPath(); g.moveTo(0, h);
    S.prof.forEach((v, i) => g.lineTo(i / (S.prof.length - 1) * w, y0 - v * sc)); g.lineTo(w, h); g.closePath(); g.fill();
    g.strokeStyle = cssv('--ring-edge'); g.beginPath(); S.prof.forEach((v, i) => { const x = i / (S.prof.length - 1) * w, y = y0 - v * sc; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
    g.setLineDash([4, 4]); g.strokeStyle = cssv('--oil'); g.beginPath(); g.moveTo(0, y0 - S.clip * sc); g.lineTo(w, y0 - S.clip * sc); g.stroke(); g.setLineDash([]);
    g.fillStyle = cssv('--muted'); g.font = FONT; g.textAlign = 'left';
    g.fillText(L('浅色 = 磨削后原始轮廓（已被去掉的部分）', 'light = profile after grinding (removed part)'), 8, 14);
    const ra0 = sfState(0).ra;
    $('sfInfo').innerHTML = `<div class="bars">
      <span>${L('超精时间', 'time')}</span><div class="bt"><i style="width:${MC.sfT * 100}%;background:var(--accent)"></i></div><span class="tr">${fmt(MC.sfT * 100, 0)}%</span>
      <span>${L('粗糙度 Ra（相对）', 'Ra (relative)')}</span><div class="bt"><i style="width:${S.ra / ra0 * 100}%;background:var(--oil)"></i></div><span class="tr">${fmt(S.ra / ra0 * 100, 0)}%</span>
      <span>${L('累计去除（相对）', 'removal (relative)')}</span><div class="bt"><i style="width:${S.removal * 100}%;background:var(--red)"></i></div><span class="tr">${fmt(S.removal * 100, 0)}%</span></div>
      <div class="explain" style="margin-top:8px"><b>${S.stage}</b></div>`;
  }
}

function microLoop(now) {
  MC.raf = 0; if (page !== 'micro') return;
  const dt = Math.min(0.05, (now - (MC.t0 || now)) / 1000); MC.t0 = now;
  drawGrain(now); drawLife(dt);
  if (MC.sfPlay) { MC.sfT = Math.min(1, MC.sfT + dt / 9); if (MC.sfT >= 1) { MC.sfPlay = false; const b = $('sfPlay'); if (b) b.textContent = L('▶ 重新超精', '▶ Run again'); } $('sfT').value = MC.sfT * 100; }
  drawSF();
  MC.raf = requestAnimationFrame(microLoop);
}

        'The roll rim is the <b>exact negative of the wheel profile</b> (convex wheel R ↔ concave roll R), fully set with diamond. The rotating roll <b>plunges the whole profile at once</b>, reshaping the wheel in seconds.'),
      plus: [L('最快：整个轮廓一次修完，节拍短', 'fastest: whole profile in one plunge, short cycle'), L('轮廓由滚轮保证，<b>件与件、批与批一致性最好</b>', 'profile fixed by the roll — <b>best part-to-part and batch consistency</b>'), L('寿命很长，适合大批量', 'very long life, ideal for high volume')],
      minus: [L('最贵，而且<b>一种轮廓一个滚轮</b>，换型要换滚轮', 'most expensive, and <b>one roll per profile</b> — changeover means a new roll'), L('定制周期长，坏了要等', 'long lead time when one fails'), L('修整力大，需要高刚性的修整主轴；修整参数（速比、切入量）要调好', 'high dressing forces need a stiff dresser spindle; speed ratio and infeed must be set correctly')],
      use: L('大批量、固定型号的沟道磨和外径磨', 'high-volume, fixed-size raceway and OD grinding')
    }
  };
}

// ── 动画：轴向截面看砂轮工作轮廓（凸 R），修整器怎么把它修出来 ──
function drawDress(dt) {
  const cv = $('dressCv'); if (!cv) return;
  DR.t += dt || 0;
  // 沟道砂轮是薄盘：沿砂轮轴剖开，截面是一根竖着的长条，上下两端的轮缘都修成圆弧（整体像拉长的椭圆）
  const { g, w, h } = prepCanvas(cv), R = Math.min(w * 0.07, h * 0.11), cx = w * 0.42, cy = h * 0.68;   // 下端轮缘圆弧中心
  const topC = h * 0.09 + R, prof = a => [cx + R * Math.sin(a), cy + R * Math.cos(a)];   // a ∈ [-A, A]
  const A = 1.35;
  // 砂轮轴（水平）和法兰
  g.fillStyle = cssv('--steel2'); g.fillRect(cx - R * 4.2, (topC + cy) / 2 - 7, R * 8.4, 14);
  g.fillStyle = '#c23fa8'; g.fillRect(cx - R * 1.9, (topC + cy) / 2 - 26, R * 0.8, 52); g.fillRect(cx + R * 1.1, (topC + cy) / 2 - 26, R * 0.8, 52);
  // 砂轮截面：长条 + 两端圆弧轮缘
  g.fillStyle = cssv('--wheel'); g.strokeStyle = cssv('--wheel-edge'); g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(...prof(-A));
  for (let a = -A; a <= A + 1e-6; a += 0.02) g.lineTo(...prof(a));
  g.lineTo(cx + R * Math.sin(A), topC - R * Math.cos(A));
  for (let a = A; a >= -A - 1e-6; a -= 0.02) g.lineTo(cx + R * Math.sin(a), topC - R * Math.cos(a));
  g.closePath(); g.fill(); g.stroke();
  for (let i = 0; i < 90; i++) { const x = cx - R * 0.8 + (i * 37 % 100) / 100 * R * 1.6, y = topC + (i * 53 % 100) / 100 * (cy - topC); g.fillStyle = cssv('--wheel-edge'); g.fillRect(x, y, 2, 2); }
  g.setLineDash([8, 4, 2, 4]); g.strokeStyle = cssv('--faint'); g.beginPath(); g.moveTo(cx - R * 4.5, (topC + cy) / 2); g.lineTo(cx + R * 4.5, (topC + cy) / 2); g.stroke(); g.setLineDash([]);
  g.fillStyle = cssv('--ink'); g.font = '600 12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif'; g.textAlign = 'left';
  g.fillText(L('沟道砂轮沿轴剖开：薄盘，两端轮缘修成圆弧（厚度方向放大示意）', 'raceway wheel cut along its axis: thin disc, rims dressed round (thickness exaggerated)'), 12, h - 12);
  g.fillStyle = cssv('--muted'); g.font = FONT;
  g.fillText(L('砂轮轴', 'wheel spindle'), cx + R * 4.3 + 4, (topC + cy) / 2 + 4);
  g.fillText(L('法兰', 'flanges'), cx + R * 2.0, (topC + cy) / 2 - 30);
  // 旋转示意：绕水平轴转
  g.strokeStyle = cssv('--accent'); g.lineWidth = 2; g.setLineDash([6, 6]); g.lineDashOffset = -DR.t * 60;
  g.beginPath(); g.ellipse(cx - R * 3.2, (topC + cy) / 2, 10, 34, 0, 0, 7); g.stroke(); g.setLineDash([]);
  g.fillStyle = cssv('--accent'); g.fillText(L('砂轮高速转', 'wheel spins fast'), cx - R * 3.2 - 64, (topC + cy) / 2 - 40);
  const m = DR.m;
  if (m === 'pen' || m === 'disc') {
    // 沿轮廓来回走：u ∈ [0,1] 往返
    const per = m === 'pen' ? 4.5 : 3.2, u = (DR.t / per) % 2, s = u < 1 ? u : 2 - u, a = -A + 2 * A * s;
    const [px, py] = prof(a), nx = Math.sin(a), ny = Math.cos(a);
    // 已修过的部分高亮
    g.strokeStyle = '#2fd17a'; g.lineWidth = 4; g.beginPath();
    for (let b = (u < 1 ? -A : a); b <= (u < 1 ? a : A); b += 0.02) { const [x, y] = prof(b); b === (u < 1 ? -A : a) ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke(); g.lineWidth = 1;
    if (m === 'pen') {
      const L0 = 70; g.save(); g.translate(px, py); g.rotate(Math.atan2(ny, nx) - Math.PI / 2 - 0.25);
      g.fillStyle = '#8f99aa'; g.fillRect(-6, 6, 12, L0); g.fillStyle = '#bfe9ff'; g.beginPath(); g.moveTo(-6, 6); g.lineTo(6, 6); g.lineTo(0, -2); g.closePath(); g.fill(); g.strokeStyle = '#4aa8d8'; g.stroke(); g.restore();
      g.fillStyle = cssv('--muted'); g.fillText(L('金刚笔：固定不转，沿轮廓一点点走', 'pen: not rotating, traverses the profile'), 12, 18);
    } else {
      const rd = R * 1.3, dcx = px + nx * rd, dcy = py + ny * rd;
      g.fillStyle = '#9aa4b4'; g.beginPath(); g.arc(dcx, dcy, rd, 0, 7); g.fill();
      g.strokeStyle = '#bfe9ff'; g.lineWidth = 5; g.beginPath(); g.arc(dcx, dcy, rd - 2, 0, 7); g.stroke(); g.lineWidth = 1;
      g.save(); g.translate(dcx, dcy); g.rotate(DR.t * 6); g.strokeStyle = '#555'; g.beginPath(); g.moveTo(0, 0); g.lineTo(rd - 6, 0); g.stroke(); g.restore();
      g.fillStyle = cssv('--muted'); g.fillText(L('金刚碟片：自己旋转，数控沿轮廓走路径', 'disc: rotates, CNC moves it along the path'), 12, 18);
    }
  } else {
    // 滚轮：凹 R，整轮廓径向切入
    const per = 3, u = (DR.t % per) / per, gap = u < 0.4 ? 30 * (1 - u / 0.4) : u < 0.7 ? 0 : 30 * (u - 0.7) / 0.3;
    const Rr = R * 1.0, rollW = R * 1.6, yC = cy + gap;
    g.fillStyle = '#9aa4b4'; g.strokeStyle = '#5d6776';
    g.beginPath(); g.moveTo(cx - rollW, h - 26); g.lineTo(cx - rollW, yC + Rr * Math.cos(A) + 2);
    g.lineTo(cx - R * Math.sin(A), yC + Rr * Math.cos(A) + 2);
    for (let a = -A; a <= A + 1e-6; a += 0.02) g.lineTo(cx + Rr * Math.sin(a), yC + Rr * Math.cos(a) + 2);
    g.lineTo(cx + rollW, yC + Rr * Math.cos(A) + 2); g.lineTo(cx + rollW, h - 26); g.closePath(); g.fill(); g.stroke();
    g.strokeStyle = '#bfe9ff'; g.lineWidth = 5; g.beginPath(); for (let a = -A; a <= A + 1e-6; a += 0.02) { const x = cx + Rr * Math.sin(a), y = yC + Rr * Math.cos(a) + 2; a === -A ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); g.lineWidth = 1;
    if (gap < 1) { g.strokeStyle = '#2fd17a'; g.lineWidth = 4; g.beginPath(); for (let a = -A; a <= A + 1e-6; a += 0.02) { const [x, y] = prof(a); a === -A ? g.moveTo(x, y) : g.lineTo(x, y); } g.stroke(); g.lineWidth = 1; }
    g.fillStyle = cssv('--muted'); g.fillText(L('金刚滚轮：凹 R 轮廓，整轮廓一次切入', 'roll: concave R, whole profile plunges at once'), 12, 18);
    g.fillStyle = cssv('--ink'); g.fillText('↑ ' + L('切入', 'plunge'), cx + rollW + 8, yC + Rr * 0.9);
  }
}

// ── 修整参数 → 砂轮表面：导程（重叠系数）、修整深度、旋转修整器速比 ──
function drawTips() {
  const cv = $('tipCv'); if (!cv) return;
  const { g, w, h } = prepCanvas(cv), r = rng(31), base = h * 0.72;
  const sharpOf = (lead, depth, qd) => Math.min(1, 0.35 + 0.33 * lead + 0.12 * depth + (DR.m === 'pen' ? 0 : 0.18 * qd));
  const sharp = sharpOf(DR.lead, DR.depth, DR.qd), sharp0 = sharpOf(1, 1, 0.6);   // 基准：导程、深度 ×1，速比 +0.6
  g.fillStyle = '#d4a35c'; g.fillRect(0, base, w, h - base);
  g.fillStyle = cssv('--pore'); g.fillRect(0, 0, w, base);
  const n = 14, step = w / n;
  for (let i = 0; i < n; i++) {
    const x = step * (i + 0.5) + (r() - 0.5) * 8, hgt = 26 + r() * 10, flat = (1 - sharp) * 16 * (0.7 + r() * 0.6);
    g.fillStyle = '#f4f7fb'; g.strokeStyle = '#6b778c';
    g.beginPath(); g.moveTo(x - 15, base + 4);
    g.lineTo(x - 4 - flat / 2, base - hgt); g.lineTo(x + 4 + flat / 2, base - hgt - (flat > 3 ? 0 : 4)); g.lineTo(x + 15, base + 4); g.closePath(); g.fill(); g.stroke();
    if (sharp > 0.65) { g.strokeStyle = '#2fd17a'; g.beginPath(); g.moveTo(x - 2, base - hgt - 6); g.lineTo(x + 3, base - hgt - 12); g.stroke(); }
    if (flat > 6) { g.strokeStyle = '#fff'; g.lineWidth = 2.5; g.beginPath(); g.moveTo(x - 4 - flat / 2, base - hgt); g.lineTo(x + 4 + flat / 2, base - hgt); g.stroke(); g.lineWidth = 1; }
  }
  g.fillStyle = '#fff'; g.font = FONT; g.textAlign = 'left';
  g.fillText(sharp > 0.7 ? L('磨粒刃口多、尖：砂轮「开」、锋利', 'many sharp edges: open, aggressive wheel') : sharp > 0.5 ? L('适中', 'balanced') : L('磨粒顶面被修平：砂轮「细」、表面光，但发热大', 'flattened grain tops: fine wheel, smooth finish, more heat'), 10, 16);
  const Ud = 1 / DR.lead, bar = (k, v, c, t) => `<span>${k}</span><div class="bt"><i style="width:${fmt(Math.min(1, v) * 100, 0)}%;background:${c}"></i></div><span class="tr">${t}</span>`;
  const Ra = 0.45 + 0.55 * sharp, heat = 1.15 - 0.6 * sharp, Ra0 = 0.45 + 0.55 * sharp0, heat0 = 1.15 - 0.6 * sharp0;
  $('tipOut').innerHTML = `<div class="bars">
    ${bar(L('重叠系数 Ud', 'overlap ratio Ud'), Ud / 4, 'var(--accent)', fmt(Ud * 2, 1))}
    ${bar(L('砂轮锋利度', 'wheel sharpness'), sharp, 'var(--green)', fmt(sharp * 100, 0) + '%')}
    ${bar(L('工件粗糙度（趋势）', 'workpiece Ra (trend)'), Ra, 'var(--orange)', '×' + fmt(Ra / Ra0, 2))}
    ${bar(L('磨削发热（趋势）', 'grinding heat (trend)'), heat, 'var(--red)', '×' + fmt(heat / heat0, 2))}
    ${bar(L('每次修掉的砂轮（趋势）', 'wheel removed per dress'), 0.25 + 0.3 * DR.depth, 'var(--purple)', '×' + fmt(DR.depth, 2))}</div>`;
}

function dressLoop(now) {
  DR.raf = 0; if (page !== 'dress') return;
  const dt = Math.min(0.05, (now - (DR.t0 || now)) / 1000); DR.t0 = now;
  drawDress(dt);
  DR.raf = requestAnimationFrame(dressLoop);
}

function consequences() {
  const out = [];

  if (W) {
    if (CL.conc === 'low') out.push(['up', L('浓度偏低：润滑和防锈变差 → 零件生锈、砂轮易堵、表面变差；还容易滋生细菌发臭', 'Low concentration: poorer lubrication and rust protection → rust, wheel loading, worse finish; bacteria and odour')]);
    if (CL.conc === 'high') out.push(['up', L('浓度偏高：起泡、残留多、清洗负担大，皮肤刺激，成本高', 'High concentration: foaming, more residue, harder washing, skin irritation, higher cost')]);
  } else {
    if (CL.conc === 'low') out.push(['up', L('黏度偏低（或油温偏高）：油膜薄，切削期长、去除多，但粗糙度可能降不下来', 'Low viscosity (or hot oil): thin film, long cutting phase, more removal, roughness may not come down')]);
    if (CL.conc === 'high') out.push(['up', L('黏度偏高（或油温偏低）：过早进入抛光期，去除不够，磨削尖峰没去干净', 'High viscosity (or cold oil): polishing starts too early, removal is insufficient, grinding peaks remain')]);
  }
  if (CL.filt === 'bad') out.push(['up', W ? L('过滤差：切屑和碎磨粒回到磨削区 → <b>划伤、拉毛</b>、粗糙度变差、喷嘴堵', 'Poor filtration: chips and grit return to the zone → <b>scratches</b>, rough finish, blocked nozzles')

  if (CL.noz === 'bad') out.push(['up', W ? L('流量不足或喷嘴没对准：磨削区冷却不够、气孔冲不干净 → <b class="r">烧伤风险上升</b>、砂轮堵塞', 'Low flow or misaimed nozzle: zone not cooled, pores not flushed → <b class="r">burn risk rises</b>, wheel loading')

  if (!out.length) out.push(['ok', L('各项正常：冷却、冲洗、润滑都到位。', 'All normal: cooling, flushing and lubrication in place.')]);
  return out;
}

// ═════════ 参数页：切入磨循环、磨削 / 超精参数趋势、留量、问题反查 ═════════
// 所有输出都是「相对基准 = 1」的趋势，不代表任何具体工艺数值
const GP = { vs: 1, vw: 1, f: 1, dress: 'mid', spark: 1, dull: 'sharp', cool: 'good' };
const SP = { P: 1, osc: 1, n: 1, t: 1, visc: 1 };

function grindModel(p) {
  const dress = { fine: [0.8, 1.1, 0.85], mid: [1, 1, 1], coarse: [1.3, 0.9, 1.2] }[p.dress];   // [粗糙度, 比能, 砂轮磨损]
  const dull = p.dull === 'dull' ? 1 : 0, cool = p.cool === 'bad' ? 1.35 : 1;
  const Q = p.f, heq = Q / p.vs;
  const u = Math.pow(heq, -0.3) * dress[1] * (1 + 0.45 * dull);
  const F = Math.pow(heq, 0.7) * (1 + 0.35 * dull);
  const T = u * Math.pow(Q, 0.7) / Math.pow(p.vw, 0.3) * cool;
  const Ra = Math.pow(heq, 0.35) * dress[0] * (1 - 0.18 * (p.spark - 1)) * (1 - 0.12 * dull);
  const ch = Math.sqrt(F) * Math.pow(p.vw, 0.6) * (1 - 0.15 * (p.spark - 1));
  const wear = Math.pow(heq, 1.2) * dress[2] * (1 - 0.3 * dull);
  return { Q, heq, F, T, Ra, ch, wear };
}
function sfModel(p) {
  const tau = Math.pow(p.P, 0.6) / (Math.pow(p.visc, 0.8) * Math.pow(p.n, 0.4));
  const rate = p.P * (Math.sqrt(p.osc) + Math.pow(p.n, 0.3)) / 2;
  const rem = rate * tau * (1 - Math.exp(-p.t / tau));
  const Ra = (0.4 + 0.6 * Math.exp(-rem / 0.55)) * (1 + 0.12 * (p.P - 1));
  return { rem, Ra, tau, ang: 2 * Math.atan(0.42 * p.osc / p.n) * 180 / Math.PI, wear: Math.pow(p.P, 1.3) * Math.sqrt(p.osc) * p.t };
}
function barsHTML(rows, base) {
  return `<div class="bars">${rows.map(([k, v, v0, bad]) => {
    const q = v / v0, w = Math.max(2, Math.min(100, q / 2 * 100));
    const cls = Math.abs(q - 1) < 0.04 ? 'eq' : ((q > 1) === bad ? 'up' : 'dn');
    const arr = Math.abs(q - 1) < 0.04 ? '＝' : q > 1 ? '↑' : '↓';
    return `<span>${k}</span><div class="bt"><i style="width:${w}%;background:${cls === 'up' ? 'var(--red)' : cls === 'dn' ? 'var(--green)' : 'var(--accent)'}"></i><s></s></div><span class="tr ${cls}">${arr} ×${fmt(q, 2)}</span>`;
  }).join('')}</div>`;
}
function grindUpd() {
  const m = grindModel(GP), b = grindModel({ vs: 1, vw: 1, f: 1, dress: 'mid', spark: 1, dull: 'sharp', cool: 'good' });
  [['gvs', 'vs'], ['gvw', 'vw'], ['gf', 'f'], ['gsp', 'spark']].forEach(([id, k]) => $(id + 'V').textContent = '×' + fmt(GP[k], 2));
  $('gOut').innerHTML = barsHTML([

}
function sfUpd() {
  const m = sfModel(SP), b = sfModel({ P: 1, osc: 1, n: 1, t: 1, visc: 1 });
  [['sP', 'P'], ['sO', 'osc'], ['sN', 'n'], ['sT', 't'], ['sV', 'visc']].forEach(([id, k]) => $(id + 'V').textContent = '×' + fmt(SP[k], 2));

// ── 切入磨循环：快进 → 粗磨 → 精磨 → 光磨 → 退回 ──
function cycleData() {
  // 时间 0..1；指令位置（砂轮进给）与实际尺寸（受系统弹性变形滞后）；单位：剩余余量（示意 µm）
  const A = 40, pts = [];
  const seg = [[0, 0.12, L('快进', 'rapid')], [0.12, 0.45, L('粗磨', 'rough')], [0.45, 0.72, L('精磨', 'finish')], [0.72, 0.9, L('光磨', 'spark-out')], [0.9, 1, L('退回', 'retract')]];
  let act = A + 6;
  for (let i = 0; i <= 200; i++) {
    const t = i / 200;
    let cmd;
    if (t < 0.12) cmd = A + 6 - 6 * t / 0.12;
    else if (t < 0.45) cmd = A - (A - 10) * (t - 0.12) / 0.33;
    else if (t < 0.72) cmd = 10 - 12 * (t - 0.45) / 0.27;
    else if (t < 0.9) cmd = -2;
    else cmd = -2 + 40 * (t - 0.9) / 0.1;
    // 实际尺寸：接触后追随指令，但有弹性让刀；光磨阶段让刀逐渐释放
    const lag = t < 0.12 ? 0 : t < 0.45 ? 6 : t < 0.72 ? 2.5 : 0;
    const target = Math.max(0, Math.min(act, cmd + lag + 2));
    act += (target - act) * (t < 0.9 ? 0.18 : 0);
    pts.push([t, cmd, act]);
  }
  return { pts, seg, A };
}
const CYC = { d: null };
function drawCycle() {
  const cv = $('cycCv'); if (!cv) return;
  if (!CYC.d || CYC.lang !== lang) { CYC.d = cycleData(); CYC.lang = lang; }
  const { g, w, h } = prepCanvas(cv), { pts, seg, A } = CYC.d, L0 = 46, R0 = 12, T0 = 18, B0 = 26, pw = w - L0 - R0, ph = h - T0 - B0;
  const X = t => L0 + t * pw, Y = v => T0 + ph - (v + 6) / (A + 14) * ph;
  const cols = ['rgba(120,130,150,.12)', 'rgba(229,52,43,.10)', 'rgba(240,138,0,.10)', 'rgba(31,157,85,.10)', 'rgba(120,130,150,.12)'];
  seg.forEach(([a, b, t], i) => { g.fillStyle = cols[i]; g.fillRect(X(a), T0, X(b) - X(a), ph); g.fillStyle = cssv('--muted'); g.font = FONT; g.textAlign = 'center'; g.fillText(t, (X(a) + X(b)) / 2, T0 + 12); });
  g.strokeStyle = cssv('--axis'); g.beginPath(); g.moveTo(L0, T0); g.lineTo(L0, T0 + ph); g.lineTo(L0 + pw, T0 + ph); g.stroke();
  g.strokeStyle = cssv('--grid'); g.beginPath(); g.moveTo(L0, Y(0)); g.lineTo(L0 + pw, Y(0)); g.stroke();
  g.fillStyle = cssv('--muted'); g.textAlign = 'right'; g.fillText(L('尺寸 0', 'size 0'), L0 - 4, Y(0) + 4);
  g.save(); g.translate(12, T0 + ph / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillText(L('剩余余量（示意）', 'remaining stock (illus.)'), 0, 0); g.restore();
  const n = Math.max(1, Math.round(PC.t * 200));
  g.setLineDash([5, 4]); g.strokeStyle = cssv('--accent'); g.lineWidth = 1.6; g.beginPath(); pts.slice(0, n + 1).forEach(([t, c], i) => i ? g.lineTo(X(t), Y(c)) : g.moveTo(X(t), Y(c))); g.stroke(); g.setLineDash([]);
  g.strokeStyle = cssv('--red'); g.lineWidth = 2.4; g.beginPath(); pts.slice(0, Math.min(n, 180) + 1).forEach(([t, , a], i) => i ? g.lineTo(X(t), Y(a)) : g.moveTo(X(t), Y(a))); g.stroke(); g.lineWidth = 1;
  const cur = pts[Math.min(n, 180)], dev = Math.round(cur[2]);
  g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(w - 190, T0 + 22, 176, 46);
  g.fillStyle = '#5ff5a8'; g.font = '700 22px Consolas,monospace'; g.textAlign = 'right'; g.fillText((dev > 0 ? '+' : '') + dev + ' µm', w - 22, T0 + 54);
  g.fillStyle = '#cfd8e6'; g.font = FONT; g.textAlign = 'left'; g.fillText(L('主动测量仪（简约读法）', 'in-process gauge (deviation)'), w - 184, T0 + 36);
  g.fillStyle = cssv('--accent'); g.fillText(L('-- 砂轮进给指令', '-- wheel feed command'), L0 + 8, T0 + ph - 22); g.fillStyle = cssv('--red'); g.fillText(L('— 工件实际尺寸', '— actual size'), L0 + 8, T0 + ph - 8);
}
function paramLoop(now) {
  PC.raf = 0; if (page !== 'params') return;
  const dt = Math.min(0.05, (now - (PC.t0 || now)) / 1000); PC.t0 = now;
  if (PC.play) { PC.t += dt / 7; if (PC.t > 1.15) PC.t = 0; }
  drawCycle();
  PC.raf = requestAnimationFrame(paramLoop);
}

        'When the wheel engages, machine, spindle and part <b>deflect elastically</b>: the command has advanced but the part has not been ground yet (red lags blue).<br>Roughing removes stock fast, finishing slows down for finish, and <b>spark-out (no feed)</b> lets the deflection relax so size, roundness and finish come in; the in-process gauge returns to 0 before retracting. Too short spark-out → size scatter, poor roundness, rough finish.')}</div>
    </div>
    <div class="glass card">
      <h2>${L('留量（切削量）是怎么定的', 'How the grinding allowance is built up')} ${GEN()}</h2>
      <svg viewBox="0 -14 420 214" style="width:100%;max-height:270px" role="img" aria-label="allowance">
        ${[[L('本道要去除的变质层 / 上道磨纹', 'affected layer / previous marks to remove'), 'var(--purple)', 40], [L('上道工序误差（尺寸、圆度）', 'previous-step error (size, roundness)'), 'var(--orange)', 46], [L('热处理变形（椭圆、翘曲）', 'heat-treatment distortion (ovality, warpage)'), 'var(--red)', 62], [L('脱碳 / 氧化层', 'decarburised / oxide layer'), 'var(--faint)', 30], [L('安全余量', 'safety margin'), 'var(--accent)', 18]]
          .reduce((acc, [t, c, hh]) => { const y = acc.y - hh; acc.s += `<rect x="40" y="${y}" width="90" height="${hh}" fill="${c}" opacity=".75" stroke="var(--bg)"/><line x1="132" y1="${y + hh / 2}" x2="150" y2="${y + hh / 2}" stroke="${c}"/><text x="154" y="${y + hh / 2 + 4}" font-size="11.5" fill="var(--ink)">${t}</text>`; acc.y = y; return acc; }, { y: 196, s: '' }).s}
        <text x="85" y="-2" font-size="11" text-anchor="middle" fill="var(--muted)">${L('单边留量', 'stock per side')}</text>
      </svg>
      <div class="explain">${L('<b>留量太大</b>：磨削时间长、砂轮消耗多，发热多，烧伤风险上升。<br><b>留量太小</b>：热处理变形和脱碳层没磨干净（局部「黑皮」、软点），椭圆、壁厚差留下来。<br>具体数值按产品尺寸和本厂工艺卡，这里只讲组成。',
        '<b>Too much</b>: long cycle, more wheel wear, more heat and burn risk.<br><b>Too little</b>: heat-treatment distortion and decarburisation are not cleaned up (black spots, soft spots); ovality and wall-thickness variation remain.<br>Actual values follow product size and your process sheets — only the make-up is shown here.')}</div>
    </div>
  </div>
  <div class="g2e">
    <div class="glass card ctl">
      <h2>${L('磨削参数 → 质量趋势', 'Grinding parameters → quality trends')} ${DEMO()}</h2>
      <div class="g2e">
        <div>
          ${sl('gvs', L('砂轮线速度 vs', 'wheel speed vs'), 0.6, 1.5, 0.05, GP.vs)}
          ${sl('gvw', L('工件转速 vw', 'work speed vw'), 0.5, 2, 0.05, GP.vw)}
          ${sl('gf', L('切入进给速度', 'plunge feed rate'), 0.4, 2.5, 0.05, GP.f)}
          ${sl('gsp', L('光磨时间', 'spark-out time'), 0, 2, 0.1, GP.spark)}
        </div>
        <div>
          <div class="grp"><div class="lab">${L('修整（修得细 / 粗）', 'dressing (fine / coarse)')}</div>${seg('gdSeg', [['fine', L('细', 'fine')], ['mid', L('中', 'medium')], ['coarse', L('粗', 'coarse')]], GP.dress)}</div>
          <div class="grp"><div class="lab">${L('砂轮状态', 'wheel condition')}</div>${seg('gwSeg', [['sharp', L('刚修整', 'freshly dressed')], ['dull', L('已钝化', 'glazed')]], GP.dull)}</div>
          <div class="grp"><div class="lab">${L('磨削液', 'coolant')}</div>${seg('gcSeg', [['good', L('流量足、对准', 'ample, aimed')], ['bad', L('不足 / 偏', 'low / misaimed')]], GP.cool)}</div>
          <div class="explain" id="gBurn"></div>
        </div>
      </div>
      <div id="gOut" style="margin-top:6px"></div>
      <p class="note">${L('竖线 = 基准工况（×1）。趋势依据磨削原理：当量切屑厚度 heq ∝ 去除率 / 砂轮线速度；切得越薄滑擦占比越大、比能越高。不是工艺数值。', 'Line = baseline (×1). Trends follow grinding principles: equivalent chip thickness heq ∝ removal rate / wheel speed; thinner cuts mean more rubbing and higher specific energy. Not process values.')}</p>
    </div>
    <div class="glass card ctl">
      <h2>${L('超精参数 → 质量趋势', 'Superfinishing parameters → quality trends')} ${DEMO()}</h2>
      <div class="g2e">
        <div>${sl('sP', L('油石压力', 'stone pressure'), 0.5, 2, 0.05, SP.P)}${sl('sO', L('摆动频率', 'oscillation frequency'), 0.5, 2, 0.05, SP.osc)}${sl('sN', L('工件转速', 'work speed'), 0.5, 2, 0.05, SP.n)}</div>
        <div>${sl('sT', L('超精时间', 'time'), 0.3, 3, 0.05, SP.t)}${sl('sV', L('超精油黏度', 'oil viscosity'), 0.5, 2, 0.05, SP.visc)}</div>
      </div>
      <div id="sOut"></div>
    </div>
  </div>
  <div class="glass card">
    <h2>${L('问题反查表：看到什么 → 先查什么', 'Troubleshooting: what you see → check first')} ${GEN()}</h2>
    <table class="tbl">
      <tr><th style="width:15%">${L('现象', 'Symptom')}</th><th style="width:20%">${L('怎么发现', 'How found')}</th><th>${L('先查（按可能性）', 'Check first (most likely first)')}</th></tr>
      ${[
        [L('磨削烧伤', 'Grinding burn'), L('酸洗（ISO 14104）、巴克豪森；肉眼往往看不出', 'temper etch (ISO 14104), Barkhausen; often invisible'), L('磨削液流量 / 喷嘴 / 浓度 → 砂轮是否钝化堵塞（修整间隔）→ 进给是否过大、光磨 → 砂轮硬度是否过硬', 'coolant flow / nozzle / concentration → wheel glazed or loaded (dressing interval) → feed too high, spark-out → wheel grade too hard')],
        [L('振纹、多棱', 'Chatter, lobing'), L('圆度仪谐波分析；测振 M 频段', 'roundness harmonics; vibration M band'), L('砂轮不平衡 → 主轴 / 砂轮轴刚性、轴承 → 工件转速与砂轮转速比 → 支撑头位置 / 中心高（无心磨）→ 修整器松动', 'wheel unbalance → spindle / quill stiffness and bearings → speed ratio → shoe position / centre height (centerless) → loose dresser')],
        [L('波纹度高', 'High waviness'), L('波纹度仪；测振 M / H 频段', 'waviness tester; vibration M / H band'), L('磨削振动、砂轮修整质量 → 超精是否到位 → 机床基础振动', 'grinding vibration, dressing quality → superfinishing effective → machine foundation vibration')],
        [L('粗糙度差', 'Poor roughness'), L('粗糙度仪', 'profilometer'), L('修整太粗 / 太久没修 → 光磨不足 → 磨削液过滤 → 超精时间、压力、油黏度', 'dressing too coarse / overdue → spark-out too short → coolant filtration → superfinishing time, pressure, viscosity')],
        [L('划伤、拉毛', 'Scratches'), L('外观、超精后目视', 'visual, after superfinishing'), L('磨削液 / 超精油过滤 → 油石崩块、夹具毛刺 → 上料 / 料道磕碰', 'coolant / oil filtration → stone chipping, fixture burrs → loading / chute knocks')],
        [L('尺寸散差 / 漂移', 'Size scatter / drift'), L('SPC 趋势', 'SPC trend'), L('主动测量仪零点（标准件）→ 液温和工件温度 → 光磨 → 砂轮磨损补偿', 'gauge zero (master) → coolant and part temperature → spark-out → wheel-wear compensation')],
        [L('沟曲率 / 沟位置超差', 'Groove radius / position out'), L('轮廓仪、沟位置测量', 'contour gauge, position check'), L('金刚石修整器磨损 → 修整程序 → 端面定位（靠山、端面平行）', 'worn diamond dresser → dressing program → face locating (chuck, face parallelism)')],
        [L('锥度、喇叭口（内孔）', 'Taper, bell-mouth (bore)'), L('圆柱度测量', 'cylindricity'), L('砂轮轴刚性 → 往复行程和越程量 → 砂轮磨损不均', 'quill stiffness → traverse stroke and overrun → uneven wheel wear')],
        [L('残留磨粒、清洁度差', 'Embedded grit, poor cleanliness'), L('清洁度检测、测振 H 频段', 'cleanliness test, vibration H band'), L('超精油过滤 → 清洗工序 → 退磁 → 磨削液交叉污染', 'oil filtration → washing → demagnetising → coolant cross-contamination')]
      ].map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}
    </table>
  </div>
  <div class="glass card">
    <h2>${L('资料来源与说明', 'Sources and notes')}</h2>
    <ul class="hint" style="padding-left:18px;margin:0;font-size:12px;line-height:1.8">
      <li>ISO 525:2020 ${L('《固结磨具 —— 形状类型、标记和代号》：磨料、粒度、硬度、组织、结合剂的标记顺序（国内对应 GB/T 2484，以现行版为准）', 'Bonded abrasive products — Shape types, designation and marking: order of abrasive, grit, grade, structure, bond (China: GB/T 2484, current edition applies)')} ${OK()}</li>
      <li>ISO 8486-1 / -2 ${L('：固结磨具粒度 F 号（F4–F220 粗粒，F230 以上微粉）。# 号微粉为 JIS 体系。本站粒度对应的微米数为近似值', ': bonded-abrasive grit sizes F (F4–F220 macrogrits, F230+ microgrits). # microgrits are the JIS system. Micrometre values here are approximate')} ${OK()}</li>
      <li>ISO 14104:2017 ${L('：磨削后表面回火（烧伤）酸洗检验，适用于包括轴承在内的钢件，在超精之前做', ': surface temper etch inspection after grinding, applicable to steel parts including bearings, done before superfinishing')} ${OK()}</li>
      <li>${L('磨削机理（滑擦 / 耕犁 / 切削、当量切屑厚度、比磨削能）、超精机理（切削期 → 抛光期）、冷却液作用：磨削加工通用教材内容', 'Grinding mechanisms (rubbing / ploughing / cutting, equivalent chip thickness, specific energy), superfinishing (cutting → polishing), coolant roles: standard grinding textbook content')} ${GEN()}</li>
    </ul>
    <p class="note" style="margin-top:6px">${OK()} = ${L('已对照标准公开信息核对标题和范围', 'title and scope checked against public standard listings')}；${GEN()} = ${L('行业通识', 'general practice')}；${DEMO()} = ${L('趋势示意，不是工艺数值。具体砂轮规格、转速、进给、留量、超精压力和时间，以本厂工艺文件为准。', 'trend illustration, not process values. Wheel specs, speeds, feeds, allowances and superfinishing settings follow your plant documents.')}</p>
  </div>`;
  [['gvs', 'vs'], ['gvw', 'vw'], ['gf', 'f'], ['gsp', 'spark']].forEach(([id, k]) => $(id).oninput = e => { GP[k] = +e.target.value; grindUpd(); });
  bindSeg('gdSeg', v => { GP.dress = v; grindUpd(); }); bindSeg('gwSeg', v => { GP.dull = v; grindUpd(); }); bindSeg('gcSeg', v => { GP.cool = v; grindUpd(); });
  [['sP', 'P'], ['sO', 'osc'], ['sN', 'n'], ['sT', 't'], ['sV', 'visc']].forEach(([id, k]) => $(id).oninput = e => { SP[k] = +e.target.value; sfUpd(); });
  grindUpd(); sfUpd();
  $('cycCv').onclick = () => { PC.play = !PC.play; };
}
PAGES.params = {
  render: renderParams,
  enter() { PC.t0 = 0; if (!PC.raf) PC.raf = requestAnimationFrame(paramLoop); },
  leave() { if (PC.raf) cancelAnimationFrame(PC.raf); PC.raf = 0; },
  redraw: drawCycle
};

// ═════════ 启动 ═════════
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('lang')) lang = q.get('lang') === 'en' ? 'en' : 'zh';
  const th = store.get('gl-theme') || 'auto';
  if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th;
  $('themeSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === th)));
  $('langSeg').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === lang)));
  if (q.get('ring')) PR.ring = q.get('ring');
  if (q.get('step')) PR.step = +q.get('step');
  if (q.get('dm')) DR.m = q.get('dm');
  if (q.get('cl')) CL.kind = q.get('cl');   // 测试用：冷却页介质
  if (q.get('xray')) V3XRAY = q.get('xray') === '1';   // 测试用：透视开关
  if (q.get('sup')) V3SUP = q.get('sup') === '1';   // 测试用：支撑开关
  if (q.get('fs')) setTimeout(toggleV3Full, 800);   // 测试用：全屏（无用户手势时走铺满窗口的替代方式）
  if (q.get('fm')) FACE_MODE = q.get('fm');   // 测试用：端面磨送料方式   // 测试用：修整方式
  renderChrome();
  if (q.get('solo')) setTimeout(() => { const t = setInterval(() => { if (V3.r && RING_GEO.tried) { V3.r.setSolo(true); V3.r.setCut(q.get('solo') === 'cut'); clearInterval(t); } }, 100); }, 300);   // 测试用
  if (q.get('cut') === '1') setTimeout(() => { const t = setInterval(() => { if (V3.r && RING_GEO.tried) { V3.r.setCut(true); clearInterval(t); } }, 100); }, 300);   // 测试用：剖开但保留设备
  const h = location.hash.slice(1);
  showPage(PAGES[h] ? h : (PAGES[store.get('gl-page')] ? store.get('gl-page') : 'process'));
})();

</script>
</body>
</html>
